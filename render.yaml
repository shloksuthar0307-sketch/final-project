services:
  # ----------------- BACKEND SERVICES -----------------
  - type: web
    name: jango-backend
    env: python
    rootDir: backend
    buildCommand: "bash build.sh"
    startCommand: "daphne core_config.asgi:application --port $PORT --bind 0.0.0.0"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: jango-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: jango-redis
          property: connectionString
      - key: AI_API_KEY
        sync: false
      - key: AI_PROVIDER
        sync: false
      - key: AI_MODEL
        sync: false
      
  - type: redis
    name: jango-redis
    ipAllowList: []

  - type: worker
    name: jango-celery
    env: python
    rootDir: backend
    buildCommand: "bash build.sh"
    startCommand: "celery -A core_config worker -l info"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: jango-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: jango-redis
          property: connectionString

  # ----------------- FRONTEND SERVICE -----------------
  - type: web
    name: jango-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    # Ensure client-side routing works (Vite creates index.html)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Set this in Render Dashboard after jango-backend is deployed!

databases:
  - name: jango-db
    databaseName: jango
    user: jango_user
